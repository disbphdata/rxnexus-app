    <script>
      // Gracefully handle disabled HMR / Vite WebSocket connection drops in AI Studio iframe environment
      window.addEventListener('error', function (event) {
        if (
          event.filename && event.filename.includes('@vite/client') ||
          (event.message && (event.message.includes('WebSocket') || event.message.includes('vite-hmr')))
        ) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
      window.addEventListener('unhandledrejection', function (event) {
        if (event.reason && (String(event.reason).includes('WebSocket') || String(event.reason).includes('vite-hmr'))) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
